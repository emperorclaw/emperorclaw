name: Release gate selftest

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to gate on.
        required: true
        type: string
      ref_name:
        description: Ref whose CI run must be green.
        required: true
        type: string
      timeout_minutes:
        description: Hard cap for the CI run to finish.
        required: false
        default: 90
        type: number

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read
    with:
      sha: ${{ inputs.sha }}
      ref_name: ${{ inputs.ref_name }}
      # A workflow_dispatch number input arrives as a string; the callee
      # declares type: number, and a string there makes GitHub drop the whole
      # calling job without a log line.
      timeout_minutes: ${{ fromJSON(inputs.timeout_minutes) }}

  report:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Report gate result
        run: echo "GATE PASSED for ${{ inputs.sha }} on ${{ inputs.ref_name }} — publish steps skipped (dry run)"
