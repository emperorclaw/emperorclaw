name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory until the ~22 pre-existing lint errors are burned down; then
      # drop continue-on-error to make it a hard gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # `next build` generates route types (.next/types) AND type-checks; a bare
      # `tsc --noEmit` fails in a clean checkout because those types aren't
      # generated yet (e.g. RouteContext). Build is the authoritative gate.
      - name: Build (typecheck + compile)
        run: npm run build

      - name: Test (unit + static)
        run: npm test

      # Guard against schema.ts / migration-snapshot drift: if `generate` wants
      # to emit a migration, the committed snapshot no longer matches the schema
      # (and an unreviewed migration could silently DROP indexes/constraints).
      - name: Verify migrations match schema (no drift)
        env:
          POSTGRES_CONNECTION_STRING: postgres://ci:ci@localhost:5432/ci
        run: |
          npx drizzle-kit generate --name _drift_check
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "::error::drizzle-kit generate produced changes — schema.ts and the migration snapshot have drifted."
            git status --porcelain -- src/db/migrations
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Hermes bridge is a production runtime shipped as its own image, but
      # its safety logic (loop/cold-start guards, routing, state persistence) is
      # Python and had no CI coverage.
      - name: Bridge tests (Hermes Python bridge)
        run: npm run test:bridge

      # The image is only otherwise built on release tags, so a broken
      # Dockerfile/dependency change would not surface until release time.
      - name: Build Docker image (no push)
        run: docker build -t emperorclaw:ci .

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emperor
          POSTGRES_PASSWORD: emperor
          POSTGRES_DB: emperor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emperor -d emperor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_CONNECTION_STRING: postgres://emperor:emperor@localhost:5432/emperor_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Provision via the real migration chain — this also guards against
      # migration/schema drift (a missing migration makes the integration
      # tests' inserts fail). See TESTING.md.
      - name: Run migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration
