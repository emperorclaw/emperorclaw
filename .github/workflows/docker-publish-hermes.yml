name: Docker Publish (Hermes)

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-hermes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Prefer a classic PAT with `write:packages` when one is configured:
          # a GHCR package created by a PAT is often not linked to the repo, and
          # GITHUB_TOKEN then fails the push with `permission_denied:
          # write_package`. Grant the repo Write access to the package under
          # org → Packages → <package> → Manage Actions access to make the
          # GITHUB_TOKEN fallback work instead.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: integrations/hermes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      # GHCR packages can be private even when the repository is public. New
      # installs have no GitHub credentials, so verify anonymous access too.
      - name: Verify public runtime download
        run: docker --config "$RUNNER_TEMP/ghcr-anonymous" pull --platform linux/amd64 "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
