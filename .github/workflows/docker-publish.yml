name: Docker Publish

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          # The image's reported version comes from this value, not from
          # package.json: a tag like v0.31.1 must ship a v0.31.1 health check
          # even if the release commit forgot to bump the package version.
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not a semver release tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token + `packages: write` above. If the push is denied with
          # `permission_denied: write_package`, grant this repository Write access
          # to the package under org → Packages → <package> → Manage Actions
          # access. (A manually-managed PAT is intentionally not used here: an
          # expired one fails the login with `denied: denied` and is easy to
          # forget.)
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image as APP_VERSION (see Dockerfile); the app strips
          # the leading `v`. This is the only place the deployed version is set.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # cache disabled temporarily to clear stale CSP headers
          no-cache: true
          platforms: linux/amd64

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Publish the top-most "## [..]" section of CHANGELOG.md as the release
          # body. Falls back to empty (auto-generated notes still apply).
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md | sed '1d' > RELEASE_BODY.md
          fi
          if [ ! -s RELEASE_BODY.md ]; then echo "_See commit history for changes._" > RELEASE_BODY.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          append_body: true
          generate_release_notes: true
