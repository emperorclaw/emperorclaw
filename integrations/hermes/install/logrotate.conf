# User logrotate config for Emperor Claw bridge logs. `emperor-hermes` installs it to
# ~/.config/emperor-hermes/logrotate.conf (replacing @HOME@) and runs it daily from a
# user timer (emperor-hermes-logrotate.timer) with its own state file.
# copytruncate is required: systemd keeps the log file descriptor open (append:).
@HOME@/.hermes/profiles/*/bridge.log
@HOME@/.hermes/emperor-bridge/shared.log
@HOME@/.local/share/emperor-hermes/hostd.log
{
    daily
    rotate 7
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
