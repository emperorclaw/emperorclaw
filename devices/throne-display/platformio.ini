; Emperor Claw Throne Display - ESP32-2424S012C-I (ESP32-C3 + GC9A01 round 240x240 + CST816D touch)
[platformio]
default_envs = throne

[env:throne]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
; The firmware version lives here and nowhere else: it is compiled in as FW_VERSION
; and copied into public/firmware/throne-display/manifest.json by `npm run firmware:build`.
custom_fw_version = 1.1.0
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"${this.custom_fw_version}\"
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.0
