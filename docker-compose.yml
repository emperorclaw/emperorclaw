services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emperor
      POSTGRES_PASSWORD: emperor
      POSTGRES_DB: emperor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emperor -d emperor"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  app:
    # Use the pre-built GHCR image for instant startup.
    # Switch to `build: .` if you want to build from source instead.
    image: ghcr.io/emperorclaw/emperorclaw:latest
    # build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - POSTGRES_CONNECTION_STRING=postgres://emperor:emperor@postgres:5432/emperor
      - APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=./.data/storage
    volumes:
      - app-storage:/app/.data/storage
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets the non-root app user actually use the socket above (Easy Setup's
    # sibling Hermes containers, self-update). install.sh detects and writes
    # the real DOCKER_GID; 999 (common Debian/Ubuntu docker-group GID) is a
    # harmless fallback if it's unset or wrong on this host.
    group_add:
      - "${DOCKER_GID:-999}"
    healthcheck:
      # Use 127.0.0.1, not localhost: the server binds IPv4 0.0.0.0, but
      # `localhost` resolves to IPv6 ::1 first in the container → refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # Optional near-real-time Google Drive mirror. Configure rclone first, then
  # start with: docker compose --profile drive up -d
  drive-sync:
    profiles: ["drive"]
    image: rclone/rclone:1.74.4
    entrypoint: ["/bin/sh", "/scripts/rclone-drive-sync.sh"]
    environment:
      - DRIVE_RCLONE_REMOTE=${DRIVE_RCLONE_REMOTE:-gdrive}
      - DRIVE_ROOT=${DRIVE_ROOT:-Emperor-Claw}
      - DRIVE_POLL_INTERVAL_SECONDS=${DRIVE_POLL_INTERVAL_SECONDS:-5}
      - DRIVE_LOCAL_ROOT=/storage/companies
    volumes:
      - app-storage:/storage
      - rclone-config:/config/rclone
      - ./scripts/rclone-drive-sync.sh:/scripts/rclone-drive-sync.sh:ro
    restart: unless-stopped

  # One-shot interactive helper. It shares the same rclone configuration
  # volume as drive-sync but never starts with the normal drive profile.
  drive-config:
    profiles: ["drive-setup"]
    image: rclone/rclone:1.74.4
    command: ["config"]
    volumes:
      - rclone-config:/config/rclone
    stdin_open: true
    tty: true

  # ---- Auto-update via Watchtower (uncomment to enable) ----
  # Checks for new GHCR images every 5 min and updates automatically.
  # Without Watchtower, use the Update button in /ops to pull + restart manually.
  # watchtower:
  #   image: containrrr/watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 300 --cleanup emperorclaw-app-1
  #   restart: unless-stopped

volumes:
  pgdata:
  app-storage:
  rclone-config:
